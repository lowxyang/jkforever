<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're invited</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Allura&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=61" />
  </head>
  <body>
    <div class="gate" id="gate">
      <div class="gate-card">
        <p class="gate-kicker">An invitation</p>
        <h1 class="script gate-names" id="gate-names"></h1>
        <form class="gate-form" id="gate-form">
          <label class="sr-only" for="passcode">Your name</label>
          <input
            id="passcode"
            name="passcode"
            type="text"
            autocomplete="off"
            placeholder="Enter your name"
            required
          />
          <button type="submit">Open the invitation</button>
          <p class="gate-error" id="gate-error" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <main class="stage" id="invitation" hidden>
      <article class="book" aria-label="Wedding invitation card">
        <section class="page page--left" id="page-gallery" aria-label="Photo gallery">
          <div class="gallery">
            <button class="preview" id="preview" type="button">
              <span class="preview-frame is-placeholder" id="preview-frame">
                <span class="preview-under" aria-hidden="true">
                  <img id="preview-under-img" alt="" />
                  <span class="page-shade"></span>
                </span>
                <span class="preview-page" id="preview-page">
                  <img id="preview-img" alt="" />
                  <span class="preview-caption" id="preview-caption"></span>
                </span>
                <span class="page-back" id="page-back" aria-hidden="true"></span>
                <span class="preview-identity" id="preview-identity">
                  <span class="script preview-identity-names" id="preview-names"></span>
                  <span class="preview-identity-date" id="preview-date"></span>
                </span>
              </span>
            </button>
            <div class="filmstrip">
              <button class="gallery-nav gallery-nav--prev" id="gallery-prev" type="button" aria-label="Previous photos">
                ‹
              </button>
              <div class="reel" id="reel" tabindex="0"></div>
              <button class="gallery-nav gallery-nav--next" id="gallery-next" type="button" aria-label="Next photos">
                ›
              </button>
            </div>
          </div>
        </section>

        <section class="page page--right" id="page-details" aria-label="Wedding information">
          <div id="page-main">
          <header class="invite-head">
            <p class="kicker" id="tagline"></p>
            <h1 class="script invite-names" id="invite-names"></h1>
            <p class="invite-meta" id="when"></p>
            <p class="invite-meta" id="where"></p>
          </header>

          <section class="panel">
            <h2>Venue</h2>
            <p id="story"></p>
            <p id="dress"></p>
          </section>

          <section class="panel panel--events">
            <h2>Order of Events</h2>
            <p class="schedule-date" id="schedule-date"></p>
            <div class="event-feature" id="schedule-feature"></div>
            <img class="divider" src="assets/decor/divider.png" alt="" />
            <ol class="schedule" id="schedule"></ol>
          </section>

          <section class="panel">
            <h2>Will you join us?</h2>
            <p id="hotel-note"></p>
            <p id="rsvp-by"></p>
            <form class="rsvp" id="rsvp-form">
              <label>
                <span>Will you attend?</span>
                <select name="attending" required>
                  <option value="yes">Joyfully accept</option>
                  <option value="no">Regretfully decline</option>
                </select>
              </label>
              <label>
                <span>Name of attendee(s)</span>
                <textarea name="attendees" required></textarea>
              </label>
              <label>
                <span>Dietary requirements</span>
                <textarea name="diet"></textarea>
              </label>
              <label>
                <span>WhatsApp number</span>
                <textarea name="contact"></textarea>
              </label>
              <label>
                <span>Leave a message or wishes for us!</span>
                <textarea name="message"></textarea>
              </label>
              <button type="submit">Send RSVP</button>
              <p class="rsvp-status" id="rsvp-status" aria-live="polite"></p>
            </form>

            <div class="rsvp-actions">
              <div class="cal-wrap">
                <button type="button" class="currency-btn" id="cal-btn" aria-haspopup="true" aria-expanded="false" aria-controls="cal-menu">Add to Calendar</button>
                <div class="cal-menu" id="cal-menu" hidden>
                  <a id="cal-google" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v2.98h5.35c-.5 2.4-2.5 3.7-5.35 3.7a5.9 5.9 0 0 1 0-11.8c1.4 0 2.6.5 3.55 1.4l2.2-2.2A9 9 0 0 0 12 3a9 9 0 1 0 0 18c5.2 0 8.6-3.65 8.6-8.8 0-.4 0-.75-.1-1.1z"/></svg>
                    Google
                  </a>
                  <a id="cal-apple" download="khine-josh-wedding-2027.ics">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.15 6.9c-.95 0-2.4-1.08-3.96-1.04-2.04.03-3.91 1.18-4.96 3.01-2.12 3.68-.55 9.1 1.52 12.09 1.01 1.45 2.2 3.09 3.79 3.04 1.52-.06 2.09-.99 3.93-.99 1.83 0 2.35.99 3.96.95 1.64-.03 2.68-1.48 3.68-2.95 1.16-1.69 1.64-3.33 1.66-3.42-.04-.01-3.18-1.22-3.22-4.86-.03-3.04 2.48-4.49 2.6-4.56-1.43-2.09-3.62-2.32-4.39-2.38-2-.16-3.68 1.09-4.61 1.09zM15.53 3.83c.84-1.01 1.4-2.43 1.25-3.83-1.21.05-2.66.8-3.53 1.82-.78.9-1.45 2.34-1.27 3.71 1.34.1 2.72-.69 3.56-1.7z"/></svg>
                    Apple
                  </a>
                  <a id="cal-outlook" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/></svg>
                    Outlook
                  </a>
                </div>
              </div>
              <a class="currency-btn" id="directions-link" target="_blank" rel="noopener noreferrer">Directions</a>
            </div>
          </section>

          <section class="panel" id="registry-panel">
            <h2>Wedding Registry</h2>
            <div id="registry-text"></div>
            <p class="registry-link">
              <a href="#registry" id="wishing-well-link">Wishing Well</a>
            </p>
          </section>

          <section class="panel" id="faqs-panel">
            <h2 class="h2-faq">FAQs</h2>
            <div class="faqs" id="faqs"></div>
          </section>

          <footer class="closing" id="closing"></footer>
          </div>

          <div id="page-registry" class="registry-page" hidden>
            <button type="button" class="registry-back" id="registry-back">&larr; Back to invitation</button>
            <section class="panel">
              <h2>Wedding Registry</h2>
              <div id="registry-page-text"></div>
              <div class="currencies" id="currencies"></div>
            </section>
          </div>
        </section>
      </article>
    </main>

    <button class="mute" id="mute" type="button" aria-label="Mute music" title="Mute music">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none" />
        <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none" />
        <path d="M16 9.5l5 5M21 9.5l-5 5" />
      </svg>
    </button>
    <audio id="music" loop preload="none"></audio>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightbox-close" type="button">Close</button>
      <button class="lightbox-nav lightbox-nav--prev" id="lightbox-prev" type="button" aria-label="Previous photo">
        ‹
      </button>
      <figure class="lightbox-frame">
        <img id="lightbox-img" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-nav--next" id="lightbox-next" type="button" aria-label="Next photo">
        ›
      </button>
    </div>

    <script src="js/config.js?v=51"></script>
    <script src="js/app.js?v=45"></script>
  </body>
</html>
