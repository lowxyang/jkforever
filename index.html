<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're invited</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=31" />
  </head>
  <body>
    <div class="gate" id="gate">
      <div class="gate-card">
        <p class="gate-kicker">An invitation</p>
        <h1 class="script gate-names" id="gate-names"></h1>
        <form class="gate-form" id="gate-form">
          <label class="sr-only" for="passcode">Your name</label>
          <input
            id="passcode"
            name="passcode"
            type="text"
            autocomplete="off"
            placeholder="Enter your name"
            required
          />
          <button type="submit">Open the invitation</button>
          <p class="gate-error" id="gate-error" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <main class="stage" id="invitation" hidden>
      <article class="book" aria-label="Wedding invitation card">
        <section class="page page--left" id="page-gallery" aria-label="Photo gallery">
          <div class="gallery">
            <button class="preview" id="preview" type="button">
              <span class="preview-frame is-placeholder" id="preview-frame">
                <span class="preview-under" aria-hidden="true">
                  <img id="preview-under-img" alt="" />
                  <span class="page-shade"></span>
                </span>
                <span class="preview-page" id="preview-page">
                  <img id="preview-img" alt="" />
                  <span class="preview-caption" id="preview-caption"></span>
                </span>
                <span class="page-back" id="page-back" aria-hidden="true"></span>
                <span class="preview-identity" id="preview-identity">
                  <span class="script preview-identity-names" id="preview-names"></span>
                  <span class="preview-identity-date" id="preview-date"></span>
                </span>
              </span>
            </button>
            <div class="filmstrip">
              <button class="gallery-nav gallery-nav--prev" id="gallery-prev" type="button" aria-label="Previous photos">
                ‹
              </button>
              <div class="reel" id="reel" tabindex="0"></div>
              <button class="gallery-nav gallery-nav--next" id="gallery-next" type="button" aria-label="Next photos">
                ›
              </button>
            </div>
          </div>
        </section>

        <section class="page page--right" id="page-details" aria-label="Wedding information">
          <header class="invite-head">
            <p class="kicker" id="tagline"></p>
            <h1 class="script invite-names" id="invite-names"></h1>
            <p class="invite-meta" id="when"></p>
            <p class="invite-meta" id="where"></p>
          </header>

          <section class="panel">
            <h2>Venue</h2>
            <p id="story"></p>
            <p id="dress"></p>
          </section>

          <section class="panel">
            <h2>Order of Events</h2>
            <p class="schedule-date" id="schedule-date"></p>
            <ol class="schedule" id="schedule"></ol>
          </section>

          <section class="panel" id="attire-panel">
            <h2>Dress code &amp; footwear</h2>
            <div id="attire"></div>
          </section>

          <section class="panel">
            <h2>Will you join us?</h2>
            <p id="hotel-note"></p>
            <p id="rsvp-by"></p>
            <form class="rsvp" id="rsvp-form">
              <label>
                <span>Will you attend?</span>
                <select name="attending" required>
                  <option value="yes">Joyfully accept</option>
                  <option value="no">Regretfully decline</option>
                </select>
              </label>
              <label>
                <span>Name of attendee(s)</span>
                <textarea name="attendees" required></textarea>
              </label>
              <label>
                <span>Dietary requirements</span>
                <textarea name="diet"></textarea>
              </label>
              <label>
                <span>WhatsApp number</span>
                <textarea name="contact"></textarea>
              </label>
              <button type="submit">Send RSVP</button>
              <p class="rsvp-status" id="rsvp-status" aria-live="polite"></p>
            </form>
          </section>

          <section class="panel" id="faqs-panel">
            <h2>FAQs</h2>
            <div class="faqs" id="faqs"></div>
          </section>
        </section>
      </article>
    </main>

    <button class="mute" id="mute" type="button" aria-label="Mute music" title="Mute music">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none" />
        <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none" />
        <path d="M16 9.5l5 5M21 9.5l-5 5" />
      </svg>
    </button>
    <audio id="music" loop preload="none"></audio>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightbox-close" type="button">Close</button>
      <button class="lightbox-nav lightbox-nav--prev" id="lightbox-prev" type="button" aria-label="Previous photo">
        ‹
      </button>
      <figure class="lightbox-frame">
        <img id="lightbox-img" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-nav--next" id="lightbox-next" type="button" aria-label="Next photo">
        ›
      </button>
    </div>

    <script src="js/config.js?v=19"></script>
    <script src="js/app.js?v=32"></script>
  </body>
</html>
